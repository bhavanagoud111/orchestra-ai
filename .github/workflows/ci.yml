name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src
      - run: uv run mypy
      - name: Build sandbox image (enables the Docker sandbox tests)
        run: docker build -t orchestra-sandbox-python:3.12 -f ../../infrastructure/docker/sandbox-python.Dockerfile ../../infrastructure/docker
      - run: uv run pytest -q
      - name: Migrations match models
        env:
          ORCHESTRA_DATABASE_URL: sqlite+aiosqlite:///./ci-migrations.db
        run: uv run alembic upgrade head && uv run alembic check
      - name: OpenAPI contract is up to date
        run: |
          uv run python -m orchestra.api.openapi_export /tmp/openapi.json
          diff -u ../../packages/shared-schemas/openapi.json /tmp/openapi.json

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, demo mode)
    runs-on: ubuntu-latest
    needs: [api, web]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - run: uv sync --frozen
        working-directory: services/api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t orchestra-ai-api .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t orchestra-ai-web .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full history with the CLI. (gitleaks-action builds a "<first>^..HEAD" range,
      # which fails on a repository's first push because the root commit has no parent.)
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1
