[project]
name = "orchestra"
version = "0.1.0"
description = "Orchestra AI API: multi-agent engineering operations control plane"
readme = "README.md"
authors = [{ name = "Bhavana Ediga", email = "bemry@umsystem.edu" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "asyncpg>=0.31.0",
    "cryptography>=46.0.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jsonschema>=4.25.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.40.0",
]

[project.scripts]
orchestra-api = "orchestra.api.app:main"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:aiosqlite.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/orchestra/demo/sample_repo", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "BLE", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF012", "S311", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "BLE001"]

[tool.mypy]
python_version = "3.12"
packages = ["orchestra"]
exclude = ["sample_repo"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
